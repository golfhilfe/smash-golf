<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smash Golf</title>
<meta name="description" content="Smash Golf: open matchplay ladder">
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Smash Golf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="config.js"></script>
<script src="clubs.js" defer></script>
<script src="club-picker.js" defer></script>
<style>
/* Layout: an app shell. Header with wordmark and "you" card, tab bar, one working column (ladder rows like a scorecard). */
:root{
  /* Brand: logo A "Impact Burst", navy #0B1F3A + volt lime #C6FF00. Text colours meet WCAG AA in both themes. */
  --bg:#f1f4f9; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#0b1f3a; --muted:#4a5a72; --line:#d3dbe7;
  --fairway:#0b1f3a; --fairway-ink:#c6ff00; --flag:#4a7a00; --flag-ink:#ffffff; --volt:#c6ff00;
  --sand:#ecf8c4; --sand-ink:#334d00;
  --ok:#17784a; --warn:#8a5600; --bad:#b3341f;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06111f; --surface:#0b1f3a; --surface-2:#112849; --ink:#edf2f8; --muted:#a3b2c8; --line:#22406a;
  --fairway:#c6ff00; --fairway-ink:#0b1f3a; --flag:#c6ff00; --flag-ink:#0b1f3a; --volt:#c6ff00;
  --sand:#24360c; --sand-ink:#ddf59a;
  --ok:#5fd39a; --warn:#f0b54a; --bad:#ff8a75; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#06111f; --surface:#0b1f3a; --surface-2:#112849; --ink:#edf2f8; --muted:#a3b2c8; --line:#22406a;
  --fairway:#c6ff00; --fairway-ink:#0b1f3a; --flag:#c6ff00; --flag-ink:#0b1f3a; --volt:#c6ff00;
  --sand:#24360c; --sand-ink:#ddf59a;
  --ok:#5fd39a; --warn:#f0b54a; --bad:#ff8a75; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.logo-h{margin:0;line-height:0}
.logo{display:block;height:clamp(52px,11vw,76px);width:auto;max-width:100%}
.tag{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:0}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang{border:0;background:transparent;padding:5px 10px;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.lang[aria-pressed="true"]{background:var(--fairway);color:var(--fairway-ink)}
@media (max-width:520px){.top-right{align-items:flex-start}}
.mecard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:0}
.mecard .pos{font-family:var(--f-mono);font-weight:700;font-size:26px;color:var(--fairway);line-height:1}
.mecard .nm{font-weight:600;overflow-wrap:anywhere}

/* demo banner */
.banner{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--sand);color:var(--sand-ink);border-radius:var(--r);padding:10px 14px;font-size:14px}
.banner b{font-weight:600}
.banner select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:100%}
.banner .sp{flex:1}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--flag)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--flag);color:var(--flag-ink);font-size:12px;line-height:20px;text-align:center}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fairway);border-color:var(--fairway);color:var(--fairway-ink)}
.btn.flag{background:var(--flag);border-color:var(--flag);color:var(--flag-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}

/* ladder */
.ladder{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rung{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.rung:first-child{border-top:0}
.rung .n{font-family:var(--f-mono);font-weight:700;font-size:22px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.rung:nth-child(-n+3) .n{color:var(--fairway)}
.rung.me{background:var(--surface-2);box-shadow:inset 4px 0 0 var(--flag)}
.rung.reach{background:color-mix(in srgb,var(--sand) 55%,var(--surface))}
.who{min-width:0;display:flex;flex-direction:column;gap:2px}
.who .nm{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.busy{color:var(--warn)} .chip.reach{color:var(--sand-ink);border-color:transparent;background:var(--sand)} .chip.you{color:var(--flag)}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--bad)} .chip.mut{color:var(--muted)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:520px){.rung{grid-template-columns:40px minmax(0,1fr)}.rung .n{font-size:18px}.right{grid-column:2;align-items:flex-start;flex-direction:row;flex-wrap:wrap}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:20px}
.card h3{font-size:16px}
.section{display:flex;flex-direction:column;gap:12px}
.section > h2{font-size:22px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.duel .side{min-width:0;display:flex;flex-direction:column;gap:2px}
.duel .side.r{text-align:right;align-items:flex-end}
.duel .vs{font-family:var(--f-display);font-weight:800;color:var(--flag);font-size:18px}
.duel .nm{font-weight:600;overflow-wrap:anywhere}
.status-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res .score{font-family:var(--f-mono);font-weight:700;color:var(--fairway);text-align:right}
.score-big{font-weight:700;font-size:18px;color:var(--fairway)}
.pts{color:var(--fairway);font-weight:700}
.mp-head{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-start}
.mp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.mp-sec{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface-2);min-width:0;display:flex;flex-direction:column;gap:6px}
.mp-sec h3{display:flex;gap:8px;align-items:baseline;font-size:16px}
.mp-n{color:var(--flag);font-weight:700}
.mp-sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.mp-note{margin:4px 0 0;font-weight:700;color:var(--bad)}
.move-up{color:var(--ok);font-weight:600}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;width:100%}
.err{color:var(--bad);font-size:14px}

/* rules */
.rules{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;max-width:68ch}
.rules li::marker{font-family:var(--f-mono);color:var(--flag);font-weight:700}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(4,10,22,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:480px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.status{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.rung{transition:background .2s}}
html,body{margin:0;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);max-width:100%}
.segb{border:0;background:transparent;padding:8px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.segb[aria-selected="true"]{background:var(--fairway);color:var(--fairway-ink)}
.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;width:100%}
.field input,.field select{font-size:16px}
.install{border-color:var(--fairway)}
.install-head{display:flex;gap:12px;align-items:center}
.install-head img{border-radius:10px}
.btn,.tab,.lang,.segb{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn{min-height:40px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 class="logo-h"><img class="logo" src="icons/logo.svg" alt="Smash Golf" width="1398" height="360"></h1>
      <div class="tag" id="tagline"></div>
    </div>
    <div class="top-right">
      <div class="langs" role="group" aria-label="Language" id="langs">
        <button type="button" class="lang" data-lang="de">DE</button>
        <button type="button" class="lang" data-lang="en">EN</button>
        <button type="button" class="lang" data-lang="sl">SL</button>
        <button type="button" class="lang" data-lang="it">IT</button>
      </div>
      <div id="mecard"></div>
    </div>
  </header>

  <div id="banner"></div>
  <div id="status" class="status" hidden></div>
  <section id="install" class="card install" hidden>
    <div class="install-head"><img src="icons/icon-192.png" alt="" width="40" height="40"><h3 data-i18n="installTitle"></h3></div>
    <p class="small" style="margin:0" id="install-text"></p>
    <div class="row-actions"><button class="btn primary" type="button" id="install-btn" hidden data-i18n="installBtn"></button><button class="btn ghost" type="button" id="install-hide" data-i18n="hide"></button></div>
  </section>

  <section id="reg" class="card" hidden>
    <div class="seg" role="tablist">
      <button type="button" class="segb" id="seg-join" data-i18n="tabJoin"></button>
      <button type="button" class="segb" id="seg-in" data-i18n="tabSignIn"></button>
    </div>
    <div id="pane-join" class="section">
      <h2 data-i18n="regTitle"></h2>
      <p class="muted" style="margin:0" data-i18n="regIntro"></p>
      <form id="regform" class="form" autocomplete="off">
        <div class="field"><label for="r-name" data-i18n="fName"></label><input id="r-name" required maxlength="60" autocomplete="name"></div>
        <div class="field"><label for="r-pin" data-i18n="fPin"></label><input id="r-pin" required inputmode="numeric" pattern="[0-9]*" maxlength="8" type="password" autocomplete="new-password"></div>
        <div class="field"><label for="r-club" data-i18n="fClub"></label><input id="r-club" maxlength="60" data-i18n-ph="phClub"></div>
        <div class="field"><label for="r-hcp" data-i18n="fHcp"></label><input id="r-hcp" inputmode="decimal" maxlength="5" data-i18n-ph="phHcp"></div>
        <div class="field"><label for="r-contact" data-i18n="fContact"></label><input id="r-contact" maxlength="80" data-i18n-ph="phContact"></div>
        <div class="field"><label for="r-email" data-i18n="fEmail"></label><input id="r-email" type="email" inputmode="email" autocomplete="email" maxlength="120" data-i18n-ph="phEmail"></div>
        <p class="small muted" style="grid-column:1/-1;margin:0"><span data-i18n="pinNote"></span> <span data-i18n="emailNote"></span> <span data-i18n="contactNote"></span></p>
        <div class="row-actions" style="grid-column:1/-1"><button class="btn primary" type="submit" id="r-submit" data-i18n="join"></button></div>
        <div id="r-err" class="err" hidden style="grid-column:1/-1"></div>
      </form>
    </div>
    <div id="pane-in" class="section" hidden>
      <h2 data-i18n="tabSignIn"></h2>
      <p class="muted" style="margin:0" data-i18n="signInIntro"></p>
      <form id="inform" class="form" autocomplete="off">
        <div class="field"><label for="i-name" data-i18n="fName"></label><select id="i-name" required></select></div>
        <div class="field"><label for="i-pin" data-i18n="fPin"></label><input id="i-pin" required inputmode="numeric" pattern="[0-9]*" maxlength="8" type="password" autocomplete="current-password"></div>
        <div class="row-actions" style="grid-column:1/-1;align-items:center"><button class="btn primary" type="submit" id="i-submit" data-i18n="signInBtn"></button><button class="btn ghost" type="button" id="i-forgot" data-i18n="forgotBtn"></button></div>
        <div id="i-err" class="err" hidden style="grid-column:1/-1"></div>
      </form>
    </div>
  </section>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="modal-root"></div>

<script>
(function(){

const MP={
sl:{title:"Match play pravila", intro:"Osnovna (specifična) pravila match playa za enotno in pregledno izvedbo dvobojev.", count:"7 sklopov pravil", badge:"Ready golf ni dovoljen",
 s:[
  ["Udarjališče",["Igralec lahko začne igro izven udarjališča brez kazni.","Nasprotnik lahko zahteva preklic in ponovitev udarca znotraj udarjališča.","Nasprotnik mora to storiti takoj, vsekakor preden izvede svoj začetni udarec.","To velja tudi, če igralec začne igro z napačnega udarjališča."]],
  ["Situacije, ki pomenijo neposredno izgubo luknje",["Igranje napačne žogice.","Igranje z napačnega mesta.","Vsaka izboljšava pogojev za igranje.","Če igralec na vprašanje nasprotnika o številu udarcev in kazni poda napačno informacijo in tega ne popravi, preden nasprotnik odigra naslednji udarec."]],
  ["Vrstni red igranja",["S prvega udarjališča začne igralec z nižjim HCP; na naslednjih udarjališčih začne igralec, ki je dobil zadnjo luknjo.","Na igrišču mora najprej igrati igralec, ki je dlje od luknje.","Če ni popolnoma jasno, se lahko vrstni red določi po dogovoru.","Če igralec igra, ko ni na vrsti, lahko nasprotnik zahteva preklic udarca brez kazni. Nasprotnik mora to storiti takoj, vsekakor preden izvede svoj naslednji udarec."],"Ready golf NI DOVOLJEN."],
  ["Končana luknja",["Po vsaki končani luknji mora biti znano, kdo je luknjo dobil, ali pa je izenačena (tie). Kasnejše spremembe niso možne potem, ko je vsaj en igralec odigral z naslednjega udarjališča ali oddal končni rezultat.","Če obstaja spor, mora eden od igralcev obvestiti nasprotnika, da bo zahteval razsodbo. To mora storiti, preden se igra nadaljuje z naslednjega udarjališča ali odda končni rezultat. V tem primeru se rezultat te luknje ne zapiše do razsodbe.","Igra se naprej."]],
  ["Beleženje rezultata",["Rezultat se beleži kot »1 up«, »2 up« itd.","Končni rezultat se beleži kot »3 : 2«, če je prednost 3 up in sta še dve luknji do konca.","Match je končan, ko ima igralec večjo prednost (več up), kot je lukenj do konca."]],
  ["Podaljšek (play-off) ob izenačenju",["Če match ni odločen niti na zadnji luknji, morata igralca nadaljevati na 1., 2., 3. itd. luknji, dokler match ni odločen ali predan."]],
  ["Predaja",["Igralec lahko kadarkoli preda naslednji udarec (given) za končanje luknje.","Igralec lahko kadarkoli po začetnem udarcu preda luknjo.","Igralec lahko kadarkoli preda MATCH."]]
 ]},
en:{title:"Match play rules", intro:"Basic (specific) match play rules for consistent and transparent matches.", count:"7 sections", badge:"Ready golf is not allowed",
 s:[
  ["Teeing area",["A player may start a hole from outside the teeing area without penalty.","The opponent may require the stroke to be cancelled and replayed from within the teeing area.","The opponent must do so immediately, and in any case before making their own tee shot.","This also applies if the player starts from the wrong teeing area."]],
  ["Situations that mean immediate loss of the hole",["Playing a wrong ball.","Playing from a wrong place.","Any improvement of the conditions affecting play.","Giving the opponent wrong information about the number of strokes and penalties when asked, and not correcting it before the opponent plays their next stroke."]],
  ["Order of play",["On the first tee the player with the lower HCP plays first; on each following tee the player who won the last hole plays first.","On the course, the player farther from the hole plays first.","If it is not completely clear, the order can be agreed.","If a player plays out of turn, the opponent may require the stroke to be cancelled without penalty. The opponent must do so immediately, and in any case before making their next stroke."],"Ready golf is NOT ALLOWED."],
  ["Completed hole",["After each hole it must be clear who won the hole or whether it was halved (tie). It can no longer be changed once at least one player has played from the next tee or submitted the final result.","If there is a dispute, one player must tell the opponent that they will ask for a ruling. This must be done before play continues from the next tee or the final result is submitted. In that case the result of the hole is not recorded until the ruling.","Play continues."]],
  ["Recording the score",["The score is recorded as “1 up”, “2 up” and so on.","The final result is recorded as “3 : 2” when a player is 3 up with two holes left.","The match is over when a player is more holes up than there are holes left to play."]],
  ["Play-off when tied",["If the match is still not decided after the last hole, the players continue on hole 1, 2, 3 and so on until the match is decided or conceded."]],
  ["Concession",["A player may concede the next stroke (given) at any time to finish the hole.","A player may concede a hole at any time after the tee shot.","A player may concede the MATCH at any time."]]
 ]},
de:{title:"Matchplay-Regeln", intro:"Grundlegende (spezifische) Matchplay-Regeln für eine einheitliche und transparente Durchführung der Matches.", count:"7 Regelbereiche", badge:"Ready Golf ist nicht erlaubt",
 s:[
  ["Abschlag",["Ein Spieler darf ein Loch ohne Strafe von außerhalb des Abschlags beginnen.","Der Gegner kann verlangen, dass der Schlag annulliert und innerhalb des Abschlags wiederholt wird.","Der Gegner muss dies sofort tun, in jedem Fall bevor er seinen eigenen Abschlag spielt.","Das gilt auch, wenn der Spieler vom falschen Abschlag beginnt."]],
  ["Situationen, die zum sofortigen Lochverlust führen",["Spielen eines falschen Balls.","Spielen von einem falschen Ort.","Jede Verbesserung der Bedingungen für das Spiel.","Wenn ein Spieler dem Gegner auf Nachfrage eine falsche Auskunft über die Anzahl der Schläge und Strafen gibt und sie nicht korrigiert, bevor der Gegner seinen nächsten Schlag spielt."]],
  ["Spielreihenfolge",["Am ersten Abschlag beginnt der Spieler mit dem niedrigeren HCP; an den folgenden Abschlägen beginnt der Spieler, der das letzte Loch gewonnen hat.","Auf dem Platz spielt zuerst der Spieler, der weiter vom Loch entfernt ist.","Wenn es nicht ganz klar ist, kann die Reihenfolge vereinbart werden.","Spielt ein Spieler außer der Reihe, kann der Gegner verlangen, dass der Schlag ohne Strafe annulliert wird. Der Gegner muss dies sofort tun, in jedem Fall bevor er seinen nächsten Schlag spielt."],"Ready Golf ist NICHT ERLAUBT."],
  ["Beendetes Loch",["Nach jedem Loch muss feststehen, wer es gewonnen hat oder ob es geteilt wurde (Tie). Spätere Änderungen sind nicht mehr möglich, sobald mindestens ein Spieler vom nächsten Abschlag gespielt oder das Endergebnis eingereicht hat.","Bei einem Streitfall muss einer der Spieler dem Gegner mitteilen, dass er eine Entscheidung verlangen wird. Das muss geschehen, bevor vom nächsten Abschlag weitergespielt oder das Endergebnis eingereicht wird. In diesem Fall wird das Ergebnis des Lochs erst nach der Entscheidung eingetragen.","Es wird weitergespielt."]],
  ["Ergebnis notieren",["Der Stand wird als „1 up“, „2 up“ usw. notiert.","Das Endergebnis wird als „3 : 2“ notiert, wenn ein Spieler 3 up ist und noch zwei Löcher zu spielen sind.","Das Match ist beendet, wenn ein Spieler mehr Löcher vorne liegt, als noch zu spielen sind."]],
  ["Stechen (Play-off) bei Gleichstand",["Ist das Match auch nach dem letzten Loch nicht entschieden, spielen die Spieler auf Loch 1, 2, 3 usw. weiter, bis das Match entschieden oder aufgegeben ist."]],
  ["Aufgabe und Schenken",["Ein Spieler kann jederzeit den nächsten Schlag schenken (given), um das Loch zu beenden.","Ein Spieler kann nach dem Abschlag jederzeit ein Loch aufgeben.","Ein Spieler kann jederzeit das MATCH aufgeben."]]
 ]},
it:{title:"Regole del match play", intro:"Regole di base (specifiche) del match play per uno svolgimento uniforme e trasparente dei match.", count:"7 gruppi di regole", badge:"Il ready golf non è consentito",
 s:[
  ["Area di partenza",["Un giocatore può iniziare la buca da fuori dell'area di partenza senza penalità.","L'avversario può chiedere che il colpo venga annullato e ripetuto dall'interno dell'area di partenza.","L'avversario deve farlo subito, e comunque prima di eseguire il proprio colpo di partenza.","Questo vale anche se il giocatore inizia dall'area di partenza sbagliata."]],
  ["Situazioni che comportano la perdita immediata della buca",["Giocare una palla sbagliata.","Giocare da un luogo sbagliato.","Qualsiasi miglioramento delle condizioni di gioco.","Se il giocatore, alla domanda dell'avversario sul numero di colpi e penalità, dà un'informazione sbagliata e non la corregge prima che l'avversario giochi il colpo successivo."]],
  ["Ordine di gioco",["Sul primo tee gioca per primo il giocatore con l'HCP più basso; sui tee successivi inizia chi ha vinto l'ultima buca.","Sul percorso gioca per primo il giocatore più lontano dalla buca.","Se non è del tutto chiaro, l'ordine può essere concordato.","Se un giocatore gioca fuori turno, l'avversario può chiedere l'annullamento del colpo senza penalità. L'avversario deve farlo subito, e comunque prima di eseguire il proprio colpo successivo."],"Il ready golf NON È CONSENTITO."],
  ["Buca completata",["Dopo ogni buca deve essere chiaro chi l'ha vinta o se è stata pareggiata (tie). Non sono possibili modifiche dopo che almeno un giocatore ha giocato dal tee successivo o ha consegnato il risultato finale.","In caso di disputa, uno dei giocatori deve avvisare l'avversario che chiederà una decisione. Deve farlo prima che il gioco riprenda dal tee successivo o che venga consegnato il risultato finale. In tal caso il risultato della buca non viene registrato fino alla decisione.","Si continua a giocare."]],
  ["Registrazione del risultato",["Il punteggio si registra come “1 up”, “2 up” e così via.","Il risultato finale si registra come “3 : 2” se un giocatore è 3 up con due buche ancora da giocare.","Il match è finito quando un giocatore ha più buche di vantaggio di quante ne restino da giocare."]],
  ["Spareggio (play-off) in caso di parità",["Se il match non è deciso nemmeno all'ultima buca, i giocatori continuano dalla buca 1, 2, 3 ecc. finché il match non è deciso o concesso."]],
  ["Concessione",["Un giocatore può concedere in qualsiasi momento il colpo successivo (given) per chiudere la buca.","Un giocatore può concedere una buca in qualsiasi momento dopo il colpo di partenza.","Un giocatore può concedere il MATCH in qualsiasi momento."]]
 ]}

// Valid final scores for a match over H holes: "N&M" ends with M holes left (N = M+1 or M+2), "1 up"/"2 up" after the last hole, xN = decided at extra hole N.
function scoresFor(H){
  const out=["1 up","2 up"];
  for(let m=1;m<H;m++) for(const n of [m+1,m+2]) if(n<=H-m) out.push(n+"&"+m);
  out.sort((a,b)=>{ const pa=a.includes("&")?a.split("&").map(Number):[0,0], pb=b.includes("&")?b.split("&").map(Number):[0,0]; return (pa[0]-pb[0])||(pa[1]-pb[1]); });
  return out.concat(["x"+(H+1),"x"+(H+2),"x"+(H+3),"conceded"]);
}

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v==null || v===false) continue;
    if(k==="class") el.className=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k==="text") el.textContent=v;
    else el.setAttribute(k, v===true?"":v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); }
  return el;
}

function ladder(){ return S.order.filter(id => S.players[id]); }
function posOf(id){ const i=ladder().indexOf(id); return i<0?null:i+1; }
function ord(n){ if(LANG==="de") return String(n); if(LANG==="it") return n+"º"; if(LANG!=="en") return n+"."; const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function pname(id){ return (S.players[id] && S.players[id].name) || ({en:"Former player",sl:"Nekdanji igralec",de:"Ehemaliger Spieler",it:"Ex giocatore"})[LANG]; }
function openOf(id){
  return Object.values(S.challenges).filter(c => OPEN.includes(c.status) && (c.challenger===id || c.defender===id))
    .sort((a,b)=>a.createdAt-b.createdAt);
}
function stats(id){
  let w=0,l=0,pts=0;
  for(const c of Object.values(S.challenges)){
    if(c.status!=="done") continue;
    if(c.challenger!==id && c.defender!==id) continue;
    if(c.winner===id){ w++; pts+=ptsOf(c); } else l++;
  }
  return {w,l,pts};
}
// Points for a win depend on where the loser stood relative to the winner when the match was decided.
function pointsFor(winPos, losePos){
  const r=winPos-losePos; // >0: loser was above the winner
  return r>0 ? 3+r : 3;
}
function ptsOf(c){
  if(typeof c.points==="number") return c.points;
  const wp=c.winner===c.challenger?c.chPos:c.dePos, lp=c.winner===c.challenger?c.dePos:c.chPos;
  return (wp&&lp)?pointsFor(wp,lp):0;
}
function kindOf(c){ return c.kind || ((c.chPos||0)>(c.dePos||0)?"ladder":"points"); }
function eligibility(meId, tId){
  const L=ladder(), mi=L.indexOf(meId), ti=L.indexOf(tId);
  if(mi<0||ti<0) return {ok:false};
  const d=mi-ti;
  if(d===0) return {ok:false};
  const down=d<0||d>2, inRange=!down; // "down" = points-only match
  if(openOf(meId).length) return {ok:false, reason:"meBusy", inRange, down};
  if(openOf(tId).length) return {ok:false, reason:"busy", inRange, down};
  return {ok:true, inRange, down, kind:down?"points":"ladder"};
}

class ApiError extends Error{ constructor(code,msg){ super(msg); this.code=code; } }
async function rpc(fn, args, token){
  let res;
  try{
    res = await fetch(CFG.url.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn, {
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json","apikey":CFG.key}, token?{"Authorization":"Bearer "+token}:/^eyJ/.test(CFG.key)?{"Authorization":"Bearer "+CFG.key}:{}),
      body:JSON.stringify(args||{})
    });
  }catch(e){ throw new ApiError("unavailable", t("unavailable")); }
  const txt = await res.text();
  let body=null; try{ body = txt?JSON.parse(txt):null; }catch(e){}
  if(!res.ok){
    const m = body && body.message;
    const map = {auth:"wrongPin", taken:"nameTaken", pin:"badPin", name:"enterName", nomatch:"noMatch"};
    if(m==="auth" && SESSION && fn!=="sg_login"){ /* stale PIN */ setSession(null); SESSION=null; S.liveMe=null; S.me=null; }
    throw new ApiError(m||"error", map[m] ? t(map[m]) : (res.status>=500 ? t("unavailable") : t("genericErr")));
  }
  return body;
}
async function authCall(path, body, failKey){
  let res;
  try{ res = await fetch(CFG.url.replace(/\/+$/,"")+"/auth/v1/"+path, {method:"POST", headers:{"Content-Type":"application/json","apikey":CFG.key}, body:JSON.stringify(body)}); }
  catch(e){ throw new ApiError("unavailable", t("unavailable")); }
  let b=null; try{ b=await res.json(); }catch(e){}
  if(!res.ok) throw new ApiError("authfail", t(failKey));
  return b||{};
}

      const win=pointsFor(posOf(S.me),i+1), lose=pointsFor(i+1,posOf(S.me));
      action=h("button",{class:"btn ghost",onclick:()=>confirmModal(t("pmTitle",{n:pname(id)}),
        t("pmText")(ord(i+1),win,lose),
        t("sendInvite"), ()=>run(()=>createChallenge(id),t("inviteSent")),"primary"), text:t("pmBtn",{w:win})});
    }
    return h("div",{class:"rung"+(isMe?" me":"")+(el.inRange?" reach":"")},
      h("div",{class:"n",text:i+1}),
      h("div",{class:"who"},
        h("div",{class:"nm",text:p.name}),
        h("div",{class:"meta"},
          p.club?h("span",{text:p.club}):null,
          p.hcp?h("span",{class:"mono",text:"HCP "+p.hcp}):null,
          h("span",{class:"mono",text:`${st.w}–${st.l}`}),
          h("span",{class:"mono pts",text:t("pts",{p:st.pts})}))),
      h("div",{class:"right"},
        h("div",{class:"row-actions"},
          isMe?h("span",{class:"chip you",text:t("you")}):null,
          el.inRange?h("span",{class:"chip reach",text:t("inRange",{p:pointsFor(posOf(S.me),i+1)})}):null,
          busy?h("span",{class:"chip busy",text:busy}):null),
        action));
  }));
}

function duelCard(c, withActions){
  const me=S.me, mine = c.challenger===me || c.defender===me;
  const side=(id,pos,lab,r)=>h("div",{class:"side"+(r?" r":"")}, h("span",{class:"small muted",text:lab+(pos?" · "+t("place",{pos:ord(pos)}):"")}), h("span",{class:"nm",text:pname(id)}));
  const L={pending:[t("stPending"),"busy"],accepted:[t("stAccepted"),"ok"],reported:[t("stReported"),"busy"]}[c.status]||["",""];
  const line=[h("span",{class:"chip "+L[1],text:L[0]})];
  if(kindOf(c)==="points") line.unshift(h("span",{class:"chip mut",text:t("pointsMatch")}));
  const acts=[];
  const oppId = c.challenger===me ? c.defender : c.challenger;
  if(c.status==="pending"){
    const dl=daysLeft(c.createdAt,ACCEPT_DAYS);
    line.push(h("span",{text: dl>0?t("daysLeft")(dl):t("acceptPassed")}));
    if(withActions && c.defender===me){
      acts.push(h("button",{class:"btn primary",onclick:()=>run(()=>accept(c),t("acceptedMsg")),text:t("accept")}));
      if(kindOf(c)==="ladder") acts.push(h("button",{class:"btn",onclick:()=>confirmModal(t("declineTitle"),t("declineText"),t("declineConcede"),()=>run(()=>finalize(c,c.challenger,"conceded","forfeit"),t("declined")),"flag"),text:t("decline")}));
      else acts.push(h("button",{class:"btn",onclick:()=>run(()=>setStatus(c,{status:"cancelled",note:"Points match declined.",closedAt:Date.now()}),t("pmDeclined")),text:t("decline")}));
    }
    if(withActions && c.challenger===me){
      if(dl<=0 && kindOf(c)==="ladder") acts.push(h("button",{class:"btn flag",onclick:()=>confirmModal(t("woTitle"),t("woText"),t("confirmWin"),()=>run(()=>finalize(c,me,"walkover","noshow"),t("woRecorded"))),text:t("claimWo")}));
      acts.push(h("button",{class:"btn ghost",onclick:()=>confirmModal(t("wdTitle"),t("wdText"),t("wdTitle"),()=>run(()=>setStatus(c,{status:"cancelled",note:"The challenger withdrew the challenge.",closedAt:Date.now()}),t("wdDone"))),text:t("withdraw")}));
    }
  }
  if(c.status==="accepted"){
    const dl=daysLeft(c.acceptedAt||c.createdAt,PLAY_DAYS);
    line.push(h("span",{text: dl>0?t("playBy",{d:fmtDate((c.acceptedAt||c.createdAt)+PLAY_DAYS*DAY)}):t("playPassed")}));
    if(withActions && mine) acts.push(h("button",{class:"btn primary",onclick:()=>reportModal(c),text:t("enterResult")}));
  }
  if(c.status==="reported"){
    line.push(h("span",{text:t("enteredBy",{r:pname(c.reportedBy),w:pname(c.winner),s:scoreLabel(c.score)+(c.holes?" · "+holesLabel(c):"")})}));
    if(withActions && mine && c.reportedBy!==me){
      acts.push(h("button",{class:"btn primary",onclick:()=>run(()=>finalize(c,c.winner,c.score,"played"),t("confirmed")),text:t("confirmResult")}));
      acts.push(h("button",{class:"btn",onclick:()=>run(()=>setStatus(c,{status:"accepted",winner:null,score:null,reportedBy:null,note:"Result disputed."}),t("disputed")),text:t("wrongResult")}));
    }
  }
  if(withActions && mine && S.mode==="live"){
    const opp=S.players[oppId];
    if(opp && opp.contact) line.push(h("span",null,t("contact"),h("b",{class:"mono",text:opp.contact})));
  }
  if(S.isOwner && S.mode==="live" && !mine) acts.push(h("button",{class:"btn ghost danger",onclick:()=>confirmModal(t("orgTitle"),t("orgText"),t("orgTitle"),()=>run(()=>setStatus(c,{status:"cancelled",note:"The organiser cancelled the challenge.",closedAt:Date.now()}),t("orgCancelled")),"flag"),text:t("orgBtn")}));
  return h("div",{class:"card"},
    h("div",{class:"duel"}, side(c.challenger,posOf(c.challenger),t("challenger")), h("div",{class:"vs",text:"vs"}), side(c.defender,posOf(c.defender),t("defender"),true)),
    h("div",{class:"status-line"}, line),
    acts.length?h("div",{class:"row-actions"},acts):null);
}

function vChallenges(){
  const all=Object.values(S.challenges).filter(c=>OPEN.includes(c.status)).sort((a,b)=>b.createdAt-a.createdAt);
  const mine=S.me?all.filter(c=>c.challenger===S.me||c.defender===S.me):[];
  const others=all.filter(c=>!mine.includes(c));
  const out=h("div",{class:"section"});
  out.append(h("h2",{text:t("myMatches")}));
  if(mine.length) out.append(h("div",{class:"list"}, mine.map(c=>duelCard(c,true))));
  else {
    const L=ladder(), mi=L.indexOf(S.me);
    const targets = mi>0 ? L.slice(Math.max(0,mi-2),mi) : [];
    out.append(h("div",{class:"card empty"}, mi<0 ? t("joinToChallenge") :
      mi===0 ? t("atTop") :
      t("canChallenge",{n:targets.map(x=>pname(x)).join(t("or"))})));
  }
  out.append(h("h2",{text:t("otherMatches")}));
  out.append(others.length?h("div",{class:"list"},others.map(c=>duelCard(c,false))):h("div",{class:"card empty",text:t("noOther")}));
  return out;
}

function vResults(){
  const done=Object.values(S.challenges).filter(c=>c.status==="done").sort((a,b)=>(b.closedAt||0)-(a.closedAt||0));
  if(!done.length) return h("div",{class:"card empty",text:t("noResults")});
  return h("div",{class:"ladder"}, done.map(c=>{
    const chWon=c.winner===c.challenger, loser=chWon?c.defender:c.challenger;
    const how = c.how==="forfeit"?t("defConceded"): c.how==="noshow"?t("defNoAccept"):"";
    return h("div",{class:"res"},
      h("div",null,
        h("div",{style:"font-weight:600",text:t("beat",{w:pname(c.winner),l:pname(loser)})}),
        h("div",{class:"meta"},
          h("span",{text:fmtDate(c.closedAt)}),
          kindOf(c)==="points" ? h("span",{text:t("pmUnchanged")}) : chWon ? h("span",{class:"move-up",text:t("movedUp",{a:ord(c.chPos),b:ord(c.dePos)})}) : h("span",{text:t("defKeeps")}),
          c.holes?h("span",{text:holesLabel(c)}):null,
          how?h("span",{text:how}):null)),
      h("div",{class:"score"}, h("div",{text:scoreLabel(c.score)}), h("div",{class:"small",text:"+"+t("pts",{p:ptsOf(c)})})));
  }));
}

function vPoints(){
  const L=ladder();
  if(!L.length) return h("div",{class:"card empty",text:t("noPlayers")});
  const rows=L.map(id=>({id,pos:posOf(id),st:stats(id)})).sort((a,b)=>b.st.pts-a.st.pts||a.pos-b.pos);
  let rank=0, prev=null;
  return h("div",{class:"section"},
    h("div",{class:"ladder"}, rows.map((r,i)=>{
      if(r.st.pts!==prev){ rank=i+1; prev=r.st.pts; }
      return h("div",{class:"rung"+(r.id===S.me?" me":"")},
        h("div",{class:"n",text:rank}),
        h("div",{class:"who"}, h("div",{class:"nm",text:pname(r.id)}),
          h("div",{class:"meta"}, h("span",{text:t("ladderPos",{p:ord(r.pos)})}), h("span",{class:"mono",text:`${r.st.w}–${r.st.l}`}))),
        h("div",{class:"right"}, h("div",{class:"score-big mono",text:t("pts",{p:r.st.pts})})));
    })),
    h("p",{class:"small muted",style:"margin:0",text:t("pointsLegend")}));
}

function vRules(){
  const rules=t("rules"), M=MP[LANG]||MP.en;
  return h("div",{class:"section"},
    h("div",{class:"card"},
      h("div",{class:"mp-head"},
        h("div",null, h("h2",{text:M.title}), h("p",{class:"muted",style:"margin:4px 0 0",text:M.intro})),
        h("div",{class:"row-actions"}, h("span",{class:"chip mut",text:M.count}), h("span",{class:"chip bad",text:M.badge}))),
      h("div",{class:"mp-grid"}, M.s.map((sec,i)=>h("div",{class:"mp-sec"},
        h("h3",null, h("span",{class:"mp-n mono",text:i+1}), h("span",{text:sec[0]})),
        h("ul",null, sec[1].map(x=>h("li",{text:x}))),
        sec[2]?h("p",{class:"mp-note",text:sec[2]}):null)))),
    h("div",{class:"card"},
      h("h2",{text:t("rulesTitle")}),
      h("ol",{class:"rules"}, rules.map(r=>h("li",{text:r.replace("{a}",ACCEPT_DAYS).replace("{p}",PLAY_DAYS)})))));
}

// ---------- demo data ----------
function loadDemo(){
  const names=[["Luka Kranjc","GK Bled","4.1"],["Ana Novak","GK Arboretum","7.8"],["Matej Zupan","GC Ljubljana","9.3"],["Nina Horvat","GK Otočec","11.0"],["Jure Kos","GK Bovec","12.6"],["Tina Vidmar","GK Trnovo","15.2"],["Rok Golob","GK Mokrice","18.4"],["Petra Mlakar","GK Bled","21.9"]];
  const P={}, order=[];
  names.forEach((n,i)=>{ const id="demo"+i; P[id]={base:n[0],name:n[0]+t("sample"),club:n[1],hcp:n[2],joinedAt:Date.now()}; order.push(id); });
  const now=Date.now();
  const C={
    c1:{id:"c1",challenger:"demo2",defender:"demo1",chPos:3,dePos:2,status:"done",winner:"demo1",score:"3&2",how:"played",points:3,createdAt:now-20*DAY,closedAt:now-12*DAY},
    c2:{id:"c2",challenger:"demo5",defender:"demo3",chPos:6,dePos:4,status:"done",winner:"demo5",score:"1 up",how:"played",points:5,createdAt:now-14*DAY,closedAt:now-6*DAY},
    c3:{id:"c3",challenger:"demo6",defender:"demo5",chPos:7,dePos:6,status:"accepted",createdAt:now-3*DAY,acceptedAt:now-2*DAY},
    c4:{id:"c4",challenger:"demo4",defender:"demo2",chPos:5,dePos:3,status:"pending",createdAt:now-1*DAY}
  };
  // apply c2 result to order: demo5 jumped from 6 to 4
  const o=order.slice(); o.splice(5,1); o.splice(3,0,"demo5");
  // ladder now: 0,1,2,5,3,4,6,7  -> fix c3/c4 positions to match
  C.c3.challenger="demo4"; C.c3.chPos=6; C.c3.dePos=4; C.c4.challenger="demo3"; C.c4.chPos=5; C.c4.defender="demo2"; C.c4.dePos=3;
  S.players=P; S.order=o; S.challenges=C;
  if(!S.demoMe) S.demoMe="demo2";
  S.me=S.demoMe;
}
function relabelDemo(){ for(const id in S.players){ const p=S.players[id]; if(p.base) p.name=p.base+t("sample"); } }
function switchMode(m){
  closeModal();
  if(m==="demo"){ S.mode="demo"; loadDemo(); }
  else { S.mode="live"; S.players=liveData.players; S.order=liveData.order; S.challenges=liveData.challenges; S.me=S.liveMe; }
  render();
}

// ---------- join / sign in ----------
let regPane = "join";
function setPane(p){
  regPane=p;
  document.getElementById("seg-join").setAttribute("aria-selected",String(p==="join"));
  document.getElementById("seg-in").setAttribute("aria-selected",String(p==="in"));
  document.getElementById("pane-join").hidden = p!=="join";
  document.getElementById("pane-in").hidden = p!=="in";
}
document.getElementById("seg-join").addEventListener("click",()=>setPane("join"));
document.getElementById("seg-in").addEventListener("click",()=>setPane("in"));
function fillNames(){
  const sel=document.getElementById("i-name"), cur=sel.value;
  sel.replaceChildren(h("option",{value:"",text:t("pickName")}), ...liveData.names.map(x=>h("option",{value:x.id,text:x.name})));
  if(cur) sel.value=cur;
}
document.getElementById("regform").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=document.getElementById("r-submit"), err=document.getElementById("r-err");
  err.hidden=true; btn.disabled=true;
  const v=id=>document.getElementById(id).value.trim();
  try{
    if(v("r-name").length<2) throw new Error(t("enterName"));
    if(!/^[0-9]{4,8}$/.test(v("r-pin"))) throw new Error(t("badPin"));
    if(v("r-email") && !EMAIL_RE.test(v("r-email"))) throw new Error(t("badEmail"));
    await Live.join({name:v("r-name"), pin:v("r-pin"), club:v("r-club"), hcp:v("r-hcp").replace(",","."), contact:v("r-contact"), email:v("r-email")});
    e.target.reset(); toast(t("welcome"));
  }catch(ex){
    if(ex && ex.code==="taken") setPane("in");
    err.textContent = (ex && ex.message) || t("joinFailed"); err.hidden=false;
    if(ex && ex.code==="taken"){ document.getElementById("i-err").textContent=ex.message; document.getElementById("i-err").hidden=false; }
  }finally{ btn.disabled=false; }
});
document.getElementById("inform").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=document.getElementById("i-submit"), err=document.getElementById("i-err");
  err.hidden=true; btn.disabled=true;
  try{
    const id=document.getElementById("i-name").value, pin=document.getElementById("i-pin").value.trim();
    if(!id) throw new Error(t("pickName"));
    await Live.login(id,pin);
    e.target.reset(); toast(t("welcomeBack"));
  }catch(ex){ err.textContent=(ex && ex.message) || t("genericErr"); err.hidden=false; }
  finally{ btn.disabled=false; }
});

// ---------- install hint ----------
let deferredPrompt=null;
const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function hintHidden(){ try{ return localStorage.getItem("sg-install-hide")==="1"; }catch(e){ return false; } }
function renderInstall(){
  const box=document.getElementById("install");
  const mobile = isIOS || /android/i.test(navigator.userAgent) || deferredPrompt;
  box.hidden = standalone || hintHidden() || !mobile;
  document.getElementById("install-text").textContent = isIOS ? t("installIos") : t("installAndroid");
  document.getElementById("install-btn").hidden = !deferredPrompt;
}
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; renderInstall(); });
document.getElementById("install-btn").addEventListener("click", async ()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; renderInstall(); });
document.getElementById("install-hide").addEventListener("click", ()=>{ try{ localStorage.setItem("sg-install-hide","1"); }catch(e){} renderInstall(); });
if("serviceWorker" in navigator && location.protocol==="https:"){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }

// ---------- PIN recovery by email ----------
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function nameSelect(id, selected){
  return h("select",{id}, h("option",{value:"",text:t("pickName")}), liveData.names.map(x=>h("option",{value:x.name,selected:x.name===selected,text:x.name})));
}
function recoveryModal(){
  const curId=document.getElementById("i-name").value;
  const cur=(liveData.names.find(x=>x.id===curId)||{}).name||"";
  const who=nameSelect("rc-name",cur);
  const mail=h("input",{id:"rc-email",type:"email",inputmode:"email",autocomplete:"email",maxlength:"120",placeholder:t("phEmail")});
  const code=h("input",{id:"rc-code",inputmode:"numeric",autocomplete:"one-time-code",maxlength:"10"});
  const pin=h("input",{id:"rc-pin",type:"password",inputmode:"numeric",maxlength:"8",autocomplete:"new-password"});
  const err=h("div",{class:"err",hidden:true});
  const step2=h("div",{class:"form",hidden:true},
    h("p",{class:"small",style:"grid-column:1/-1;margin:0",text:t("codeSent")}),
    h("div",{class:"field"},h("label",{for:"rc-code",text:t("fCode")}),code),
    h("div",{class:"field"},h("label",{for:"rc-pin",text:t("newPin")}),pin));
  const showErr=m=>{ err.textContent=m; err.hidden=false; };
  const saveBtn=h("button",{class:"btn primary",hidden:true,onclick:async e=>{
    err.hidden=true;
    if(!/^[0-9]{4,8}$/.test(pin.value.trim())){ showErr(t("badPin")); return; }
    e.target.disabled=true;
    try{ const tok=await verifyRecoveryCode(mail.value.trim().toLowerCase(), code.value.trim()); await recoverPin(tok, who.value, pin.value.trim()); closeModal(); toast(t("pinChanged")); }
    catch(ex){ showErr(ex.message); }
    finally{ e.target.disabled=false; }
  }, text:t("savePin")});
  const sendBtn=h("button",{class:"btn primary",onclick:async e=>{
    err.hidden=true;
    const n=liveData.names.find(x=>x.name===who.value);
    if(!n){ showErr(t("pickName")); return; }
    const pl=liveData.players[n.id];
    if(pl && pl.hasEmail===false){ showErr(t("noEmailSaved")); return; }
    if(!EMAIL_RE.test(mail.value.trim())){ showErr(t("badEmail")); return; }
    e.target.disabled=true;
    try{ await sendRecoveryEmail(mail.value.trim().toLowerCase()); try{ localStorage.setItem("sg-rec-name",who.value); }catch(x){} step2.hidden=false; sendBtn.hidden=true; saveBtn.hidden=false; code.focus(); }
    catch(ex){ showErr(ex.message); }
    finally{ e.target.disabled=false; }
  }, text:t("sendCode")});
  modal(t("recTitle"), h("div",{class:"section"},
    h("p",{class:"muted",style:"margin:0",text:t("recIntro")}),
    h("div",{class:"form"}, h("div",{class:"field"},h("label",{for:"rc-name",text:t("fName")}),who), h("div",{class:"field"},h("label",{for:"rc-email",text:t("fEmail")}),mail)),
    step2, err), [sendBtn, saveBtn, h("button",{class:"btn ghost",onclick:closeModal,text:t("cancel")})]);
}
document.getElementById("i-forgot").addEventListener("click", ()=>{ if(CONFIGURED) recoveryModal(); });
// arriving from the link in the email (#access_token=...)
function linkRecoveryModal(token){
  let saved=""; try{ saved=localStorage.getItem("sg-rec-name")||""; }catch(e){}
  const who=nameSelect("rl-name",saved);
  const pin=h("input",{id:"rl-pin",type:"password",inputmode:"numeric",maxlength:"8",autocomplete:"new-password"});
  const err=h("div",{class:"err",hidden:true});
  modal(t("recTitle"), h("div",{class:"section"},
    h("p",{class:"muted",style:"margin:0",text:t("linkIntro")}),
    h("div",{class:"form"}, h("div",{class:"field"},h("label",{for:"rl-name",text:t("fName")}),who), h("div",{class:"field"},h("label",{for:"rl-pin",text:t("newPin")}),pin)), err),
    [h("button",{class:"btn primary",onclick:async e=>{
      err.hidden=true;
      if(!who.value){ err.textContent=t("pickName"); err.hidden=false; return; }
      if(!/^[0-9]{4,8}$/.test(pin.value.trim())){ err.textContent=t("badPin"); err.hidden=false; return; }
      e.target.disabled=true;
      try{ await recoverPin(token, who.value, pin.value.trim()); closeModal(); toast(t("pinChanged")); }
      catch(ex){ err.textContent=ex.message; err.hidden=false; }
      finally{ e.target.disabled=false; }
    }, text:t("savePin")}), h("button",{class:"btn ghost",onclick:closeModal,text:t("cancel")})]);
}
const LINK_TOKEN = (()=>{ const m=/[#&]access_token=([^&]+)/.exec(location.hash||""); if(!m) return null; try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} return decodeURIComponent(m[1]); })();

// ---------- boot ----------
const _applyStatic = applyStatic;
applyStatic = function(){ _applyStatic(); renderInstall(); fillNames(); };
setPane("join");
applyStatic();
render();
if(!CONFIGURED){
  S.live=null; switchMode("demo");
  const st=document.getElementById("status"); st.textContent=t("notConfigured"); st.hidden=false;
} else {
  S.live=Live; S.liveMe = SESSION ? SESSION.id : null; S.me=S.liveMe;
  S.canWrite=!!SESSION;
  refresh().then(()=>{ if(LINK_TOKEN) linkRecoveryModal(LINK_TOKEN); });
  setInterval(()=>{ if(document.visibilityState==="visible" && S.mode==="live" && !document.querySelector(".overlay")) refresh(); }, 10000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh(); });
  window.addEventListener("online",()=>refresh());
}

})();
